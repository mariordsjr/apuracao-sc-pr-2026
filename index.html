<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#174a78">
<title>Apuração 2026 — SC + PR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f6f8;
  color: #17212b;
}

header {
  background: #174a78;
  color: white;
  padding: 28px 20px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

header p {
  margin: 0;
  font-size: 16px;
  opacity: .9;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

select,
input,
button {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #cbd3d8;
  font-size: 16px;
  background: white;
}

input {
  margin-top: 12px;
}

button {
  margin-top: 12px;
  background: #174a78;
  color: white;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

button:active {
  transform: scale(.99);
}

.status {
  margin-top: 12px;
  padding: 14px;
  border-radius: 12px;
  background: white;
  border: 1px solid #d6dde1;
}

.status.ok {
  color: #14733c;
}

.status.error {
  color: #a52e2e;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.card {
  background: white;
  border: 1px solid #d6dde1;
  border-radius: 14px;
  padding: 16px;
}

.card span {
  display: block;
  color: #68747d;
  font-size: 14px;
  margin-bottom: 8px;
}

.card strong {
  font-size: 22px;
}

section {
  margin-top: 22px;
}

section h2 {
  margin-bottom: 10px;
}

.table-wrap {
  overflow-x: auto;
  background: white;
  border-radius: 14px;
  border: 1px solid #d6dde1;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th,
td {
  padding: 13px 12px;
  border-bottom: 1px solid #e4e8eb;
  text-align: left;
}

th {
  background: #eef2f5;
  color: #56616a;
}

td.num,
th.num {
  text-align: right;
}

.position {
  font-weight: bold;
}

.candidate {
  font-weight: bold;
}

.party {
  color: #68747d;
  font-size: 14px;
}

.vote {
  font-weight: bold;
}

.pct {
  color: #174a78;
  font-weight: bold;
}

footer {
  margin: 25px 0 10px;
  color: #68747d;
  font-size: 13px;
  line-height: 1.5;
}

@media (max-width: 700px) {
  .controls {
    grid-template-columns: 1fr;
  }

  .cards {
    grid-template-columns: 1fr 1fr;
  }

  header h1 {
    font-size: 24px;
  }

  main {
    padding: 14px;
  }
}

@media (max-width: 420px) {
  .cards {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Apuração 2026 — Santa Catarina + Paraná</h1>
  <p>Dados públicos do TSE • atualização automática a cada 30 segundos</p>
</header>

<main>

  <div class="controls">

    <select id="uf">
      <option value="sc">Santa Catarina (SC)</option>
      <option value="pr">Paraná (PR)</option>
    </select>

    <select id="cargo">
      <option value="3">Governador</option>
      <option value="5">Senador</option>
      <option value="6">Deputado Federal</option>
      <option value="7">Deputado Estadual</option>
    </select>

  </div>

  <input
    id="busca"
    type="search"
